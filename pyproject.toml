[project]
name = "ai_agent_demo"
version = "0.1.0"
description = "AI agent demo on a local LLM – tool selection and sensitive-data pseudonymization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests~=2.32.0",
    "spacy>=3.8.0,<3.9.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85",
]

[project.urls]
Repository = "https://github.com/siasty/Ai-agent-demo-"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_agent_demo*"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
