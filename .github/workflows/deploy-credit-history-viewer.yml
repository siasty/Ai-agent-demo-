name: Deploy credit history event viewer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-credit-history-viewer.yml"
      - "demo_recordings/credit_history_event_viewer.html"
      - "demo_recordings/credit_history_tool_demo.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          install -d _site
          cp demo_recordings/credit_history_event_viewer.html _site/index.html
          cp demo_recordings/credit_history_event_viewer.html _site/credit_history_event_viewer.html
          cp demo_recordings/credit_history_tool_demo.json _site/credit_history_tool_demo.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
