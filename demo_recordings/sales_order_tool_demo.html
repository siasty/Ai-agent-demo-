<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent Demo Tool Recording</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182230;
      --muted: #62748a;
      --line: #d9e2ec;
      --panel: #ffffff;
      --bg: #f3f6fa;
      --blue: #1769e0;
      --green: #16835a;
      --purple: #7651c9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .stage {
      width: min(1180px, calc(100vw - 48px));
      margin: 24px auto;
      border: 1px solid var(--line);
      background: var(--panel);
      min-height: calc(100vh - 48px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      box-shadow: 0 20px 70px rgba(21, 32, 48, .12);
    }
    header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    .brand { font-weight: 760; font-size: 18px; }
    .pill {
      border: 1px solid var(--line);
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
      background: #f8fafc;
    }
    main {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 620px;
    }
    .rail {
      border-right: 1px solid var(--line);
      padding: 18px;
      background: #f8fafc;
    }
    .rail h2 {
      margin: 0 0 14px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: .08em;
    }
    .step {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      padding: 10px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 11px;
      background: white;
    }
    .step.active { color: var(--ink); font-weight: 650; }
    .step.active .dot { border-color: var(--accent); color: var(--accent); }
    .content {
      padding: 34px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 24px;
    }
    .hero {
      max-width: 850px;
    }
    .kicker {
      color: var(--accent);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 800;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 38px;
      line-height: 1.08;
      margin: 0 0 12px;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--line);
      background: #101828;
      color: #dbe7ff;
      padding: 18px;
      overflow: auto;
      min-height: 330px;
      max-height: 440px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 6px;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: 16px 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }
    .bar {
      height: 8px;
      background: #e9eef5;
      overflow: hidden;
    }
    .bar > div {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .35s linear;
    }
    button {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 8px 12px;
      font-weight: 650;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="stage">
    <header>
      <div class="brand">AI Agent Demo recording</div>
      <div class="pill">Local Ollama + ERPNext tool run</div>
    </header>
    <main>
      <aside class="rail">
        <h2>Timeline</h2>
        <div id="steps"></div>
      </aside>
      <section class="content">
        <div class="hero">
          <div id="kicker" class="kicker"></div>
          <h1 id="title"></h1>
          <p id="body"></p>
        </div>
        <pre id="code"></pre>
      </section>
    </main>
    <footer>
      <div class="bar"><div id="progress"></div></div>
      <button id="toggle">Pause</button>
    </footer>
  </div>
  <script>
    const slides = [{"kicker": "AI Agent Demo", "title": "Tool run: analyze_sales_order", "body": "Query: Analyze sales order SAL-ORD-2026-00006 for risks", "code": "{\n  \"sales_order_id\": \"SAL-ORD-2026-00006\"\n}", "accent": "blue"}, {"kicker": "Step 1", "title": "ERP data fetched", "body": "The tool reads the Sales Order, Customer, contact, address, items, exposure, and margin figures from ERPNext.", "code": "{\n  \"sales_order_id\": \"SAL-ORD-2026-00006\",\n  \"customer\": {\n    \"name\": \"MicroDevices Partners\",\n    \"tax_id\": \"33-4455667\",\n    \"email\": \"amanda.wilson@microdevices.co\",\n    \"phone\": \"+1-555-0199\",\n    \"address\": \"1678 Technology Center, 98109 Seattle\",\n    \"credit_limit\": 60000.0,\n    \"current_exposure\": 35000.0,\n    \"payment_terms\": \"N/A\"\n  },\n  \"sales_rep\": {\n    \"name\": \"Administrator\",\n    \"email\": \"Administrator\"\n  },\n  \"order\": {\n    \"currency\": \"PLN\",\n    \"total_net\": 13100.0,\n    \"requested_delivery_date\": \"2026-07-22\",\n    \"shipping_address\": \"Same as billing\",\n    \"discount_percent\": 0.0,\n    \"historical_avg_discount_percent\": 0.0\n  },\n  \"items\": [\n    {\n      \"sku\": \"SENSOR-DHT22\",\n      \"description\": \"DHT22 Temperature Humidity Sensor\",\n      \"quantity\": 450.0,\n      \"unit_price\": 18.0,\n      \"unit_cost\": 10.8,\n      \"margin_percent\": 40.0\n    },\n    {\n      \"sku\": \"LCD-16X2\",\n      \"description\": \"16x2 Character LCD Display\",\n      \"quantity\": 300.0,\n      \"unit_price\": 12.5,\n      \"unit_cost\": 7.0,\n      \"margin_percent\": 44.0\n    },\n    {\n      \"sku\": \"CAP-100UF\",\n      \"description\": \"100µF Electrolytic Capacitor\",\n      \"quantity\": 500.0,\n      \"unit_price\": 2.5\n...", "accent": "blue"}, {"kicker": "Step 2", "title": "Sensitive data detected", "body": "spaCy NER and custom regex patterns identify names, email, phone, tax ID, and address fragments before the prompt is built.", "code": "{\n  \"sensitive_fields\": {\n    \"customer_name\": \"MicroDevices Partners\",\n    \"customer_email\": \"amanda.wilson@microdevices.co\",\n    \"customer_phone\": \"+1-555-0199\",\n    \"customer_address\": \"1678 Technology Center, 98109 Seattle\",\n    \"sales_rep_name\": \"Administrator\",\n    \"sales_rep_email\": \"Administrator\"\n  },\n  \"detection_method\": \"Automated AI/NLP Detection\",\n  \"nlp_framework\": \"spaCy en_core_web_sm\",\n  \"language_model\": \"en language model\",\n  \"entity_types_supported\": [\n    \"CARDINAL\",\n    \"DATE\",\n    \"EVENT\",\n    \"FAC\",\n    \"GPE\",\n    \"LANGUAGE\",\n    \"LAW\",\n    \"LOC\",\n    \"MONEY\",\n    \"NORP\"\n  ],\n  \"custom_patterns\": [\n    \"EMAIL\",\n    \"PHONE\",\n    \"ORG\",\n    \"FACILITY\",\n    \"ZIPCODE\",\n    \"IBAN\",\n    \"SSN\",\n    \"CREDIT_CARD\",\n    \"TAX_ID\"\n  ]\n}", "accent": "purple"}, {"kicker": "Step 3", "title": "Data pseudonymized", "body": "Real identifiers are replaced with stable tokens. This is the mapping used to keep the LLM prompt private.", "code": "[\n  \"MicroDevices Partners → ORGANIZATION_01\",\n  \"33-4455667 → COMPANY_01\",\n  \"amanda.wilson@microdevices.co → EMAIL_01\",\n  \"1-555-0199 → PHONE_01\",\n  \"Seattle → LOCATION_01\",\n  \"98109 → LOCATION_02\",\n  \"Technology Center → LOCATION_03\"\n]", "accent": "green"}, {"kicker": "Step 4", "title": "Safe AI input", "body": "The model receives pseudonymized business data and numeric metrics, not raw customer identifiers.", "code": "{\n  \"sales_order_id\": \"SAL-ORD-2026-00006\",\n  \"customer\": {\n    \"name\": \"ORGANIZATION_01\",\n    \"tax_id\": \"COMPANY_01\",\n    \"email\": \"EMAIL_01\",\n    \"phone\": \"+PHONE_01\",\n    \"address\": \"1678 LOCATION_03, LOCATION_02 LOCATION_01\",\n    \"credit_limit\": 60000.0,\n    \"current_exposure\": 35000.0,\n    \"payment_terms\": \"N/A\"\n  },\n  \"sales_rep\": {\n    \"name\": \"Administrator\",\n    \"email\": \"Administrator\"\n  },\n  \"order\": {\n    \"currency\": \"PLN\",\n    \"total_net\": 13100.0,\n    \"requested_delivery_date\": \"2026-07-22\",\n    \"shipping_address\": \"Same as billing\",\n    \"discount_percent\": 0.0,\n    \"historical_avg_discount_percent\": 0.0\n  },\n  \"items\": [\n    {\n      \"sku\": \"SENSOR-DHT22\",\n      \"description\": \"DHT22 Temperature Humidity Sensor\",\n      \"quantity\": 450.0,\n      \"unit_price\": 18.0,\n      \"unit_cost\": 10.8,\n      \"margin_percent\": 40.0\n    },\n    {\n      \"sku\": \"LCD-16X2\",\n      \"description\": \"16x2 Character LCD Display\",\n      \"quantity\": 300.0,\n      \"unit_price\": 12.5,\n      \"unit_cost\": 7.0,\n      \"margin_percent\": 44.0\n    },\n    {\n      \"sku\": \"CAP-100UF\",\n      \"description\": \"100µF Electrolytic Capacitor\",\n      \"quantity\": 500.0,\n      \"unit_price\": 2.5,\n      \"unit_cost\": 2.1,\n      \"margin_percent\": 16.0\n    }\n  ],\n  \"notes\": \" \"\n}", "accent": "green"}, {"kicker": "Step 5", "title": "Local LLM analysis", "body": "Ollama returns a structured JSON risk analysis.", "code": "{\n    \"risk_level\": \"low\",\n    \"main_risk_factors\": [\"credit risk due to high current exposure\", \"margin risk due to unusual discount percent\"],\n    \"recommended_actions\": [\"Monitor customer's credit history and limit usage\", \"Verify the reasonability of the requested discounts/margins\"],\n    \"manual_review_required\": true,\n    \"analysis_summary\": \"The sales order has a high credit risk due to the customer's current exposure exceeding their credit limit. Additionally, there is a margin risk due to an unusual discount percent on one of the items.\"\n}", "accent": "purple"}, {"kicker": "Result", "title": "Risk level: low", "body": "Order value: 13100.0 PLN. Sensitive replacements: 7. Final result is ready for the business user.", "code": "{\n    \"risk_level\": \"low\",\n    \"main_risk_factors\": [\"credit risk due to high current exposure\", \"margin risk due to unusual discount percent\"],\n    \"recommended_actions\": [\"Monitor customer's credit history and limit usage\", \"Verify the reasonability of the requested discounts/margins\"],\n    \"manual_review_required\": true,\n    \"analysis_summary\": \"The sales order has a high credit risk due to the customer's current exposure exceeding their credit limit. Additionally, there is a margin risk due to an unusual discount percent on one of the items.\"\n}", "accent": "green"}];
    const duration = 3600;
    let index = 0;
    let timer = null;
    let playing = true;
    const colors = { blue: "#1769e0", green: "#16835a", purple: "#7651c9" };

    function renderSteps() {
      document.getElementById("steps").innerHTML = slides.map((slide, i) => `
        <div class="step ${i === index ? "active" : ""}">
          <div class="dot">${i + 1}</div>
          <div>${escapeHtml(slide.kicker)}<br>${escapeHtml(slide.title)}</div>
        </div>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function render() {
      const slide = slides[index];
      const color = colors[slide.accent] || colors.blue;
      document.documentElement.style.setProperty("--accent", color);
      document.getElementById("kicker").textContent = slide.kicker;
      document.getElementById("title").textContent = slide.title;
      document.getElementById("body").textContent = slide.body;
      document.getElementById("code").textContent = slide.code;
      document.getElementById("progress").style.width = `${((index + 1) / slides.length) * 100}%`;
      renderSteps();
    }

    function next() {
      index = (index + 1) % slides.length;
      render();
    }

    function start() {
      timer = setInterval(next, duration);
    }

    document.getElementById("toggle").addEventListener("click", () => {
      playing = !playing;
      document.getElementById("toggle").textContent = playing ? "Pause" : "Play";
      if (playing) {
        start();
      } else {
        clearInterval(timer);
      }
    });

    render();
    start();
  </script>
</body>
</html>
